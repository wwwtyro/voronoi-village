<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voronoi Village</title>
    <!-- Inline so the cover styles apply on first paint; the stylesheet only
         arrives with the JS bundle, which is exactly the FOUC being hidden. -->
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #002b36;
      }
      #loading {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #002b36;
        color: #e0e0e0;
        font-family: system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="loading">Loading...</div>
    <canvas id="canvas"></canvas>
    <div id="overlay">
      <section>
        <label for="population-select">Minimum population</label>
        <select id="population-select"></select>
        <label for="weight-slider">Population weight</label>
        <input id="weight-slider" type="range" min="0" max="1" step="0.01" />
        <span id="weight-value"></span>
        <div class="control-description">
          Grows the cells of more populous cities at the expense of their
          neighbors. At zero, every city competes equally.
        </div>
        <label for="centering-slider">Cell centering</label>
        <input id="centering-slider" type="range" min="0" max="10" step="1" />
        <span id="centering-value"></span>
        <div class="control-description">
          Smooths the diagram by nudging each cell toward its center, making
          cells rounder and more uniform. Cells drift away from their cities as
          this increases.
        </div>
      </section>
      <details>
        <summary>Styling</summary>
        <label class="checkbox">
          <input id="borders-checkbox" type="checkbox" />
          Borders
        </label>
        <label for="line-width-slider">Line width</label>
        <input id="line-width-slider" type="range" min="0.25" max="4" step="0.05" />
        <span id="line-width-value"></span>
        <label for="theme-select">Theme</label>
        <select id="theme-select"></select>
        <!-- Rows are built by the controller from the model's color list. -->
        <div id="color-controls"></div>
      </details>
    </div>
    <a
      id="github-link"
      href="https://github.com/wwwtyro/voronoi-village"
      aria-label="View on GitHub"
    >
      <svg viewBox="0 0 16 16" width="28" height="28" fill="currentColor" aria-hidden="true">
        <path
          d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27s-1.36.09-2 .27c-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"
        />
      </svg>
    </a>
    <div id="tooltip" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
